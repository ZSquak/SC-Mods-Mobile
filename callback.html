<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Authenticating...</title>
</head>
<body>
    <p id="status" style="font-family: sans-serif; text-align: center; margin-top: 50px; font-size: 18px;">
        Authorizing Stumble Cups Launcher... Redirecting to app...
    </p>
    <script>
        window.onload = function() {
            const hash = window.location.hash;
            if (hash) {
                // Reconstruct the exact URL that Android App Links expects to intercept
                const appDeepLink = "https://zsquak.github.io/SC-Mods-Mobile/callback.html" + hash;
                
                // Force open via location assignment or direct replacement
                setTimeout(() => {
                    window.location.replace(appDeepLink);
                }, 500);

                // Provide a clear fallback button if the browser blocks the automatic transition
                document.body.innerHTML += `
                    <div style="text-align: center; margin-top: 20px;">
                        <a href="${appDeepLink}" style="font-size: 20px; padding: 10px 20px; background: #5865F2; color: white; text-decoration: none; border-radius: 5px;">
                            Click here to return to app
                        </a>
                    </div>
                `;
            } else {
                document.getElementById("status").innerText = "No authorization token found.";
            }
        };
    </script>
</body>
</html>
