<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Authenticating...</title>
</head>
<body>
    <p id="status">Authorizing Stumble Cups Launcher...</p>
    <script>
        // Discord returns the token in the URL fragment (after #)
        window.onload = function() {
            const hash = window.location.hash;
            if (hash) {
                // Construct the deep link back to your app
                const appDeepLink = "https://zsquak.github.io/SC-Mods-Mobile/callback.html" + hash;
                
                // Update text
                document.getElementById("status").innerText = "Redirecting back to app...";
                
                // Try to redirect automatically
                window.location.href = appDeepLink;
                
                // Fallback manual link if redirect fails
                setTimeout(() => {
                    document.body.innerHTML += `<br><br><a href="${appDeepLink}" style="font-size: 20px;">Click here if not redirected automatically</a>`;
                }, 1000);
            } else {
                document.getElementById("status").innerText = "No authorization token found.";
            }
        };
    </script>
</body>
</html>
