<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Authenticating...</title>
</head>
<body>
    <div style="font-family: sans-serif; text-align: center; margin-top: 100px;">
        <h2>Discord Authorization Successful!</h2>
        <p id="status">Returning to Stumble Cups Launcher...</p>
        <p style="margin-top: 20px;">
            <a id="launch-btn" href="#" style="font-size: 18px; padding: 12px 24px; background: #5865F2; color: white; text-decoration: none; border-radius: 5px; display: inline-block;">
                Click here if the app doesn't open automatically
            </a>
        </p>
    </div>
    <script>
        window.onload = function() {
            const hash = window.location.hash;
            if (hash) {
                // Point directly back to your GitHub Pages callback URL with the token hash
                // Android's App Link intent filter will intercept this HTTPS link automatically
                const targetUrl = "https://zsquak.github.io/SC-Mods-Mobile/callback.html" + hash;
                
                // Update the fallback button link
                document.getElementById("launch-btn").setAttribute("href", targetUrl);

                // Attempt automated trigger
                setTimeout(function() {
                    window.location.replace(targetUrl);
                }, 300);
            } else {
                document.getElementById("status").innerText = "No authorization token found in URL.";
            }
        };
    </script>
</body>
</html>
